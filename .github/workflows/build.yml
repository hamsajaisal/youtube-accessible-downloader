name: Build & Release Windows Downloader

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish Single-File Self-Contained App
      run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o publish

    - name: Zip Standalone Portable Executable
      run: Compress-Archive -Path publish\YoutubeDownloader.exe -DestinationPath YouTube.Accessible.Downloader.Portable.zip

    - name: Compile Windows Setup Installer (Inno Setup)
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Upload Build Artifacts (Dev/PR testing)
      if: startsWith(github.ref, 'refs/tags/') != true
      uses: actions/upload-artifact@v4
      with:
        name: youtube-downloader-csharp-build
        path: |
          YouTube.Accessible.Downloader.Portable.zip
          YouTube.Accessible.Downloader.Setup.exe
        retention-days: 7

    - name: Create GitHub Release and Upload Binaries
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          YouTube.Accessible.Downloader.Portable.zip
          YouTube.Accessible.Downloader.Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
